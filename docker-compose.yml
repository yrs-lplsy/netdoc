services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kbrag-pg
    environment:
      POSTGRES_DB: kbrag
      POSTGRES_USER: kbrag
      POSTGRES_PASSWORD: kbrag123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: kbrag-redis
    ports:
      - "6379:6379"
volumes:
  pgdata:
