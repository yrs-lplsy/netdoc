server:
  port: 9000   # 避开 80 系列(8080 被 rpki-system 占用,8081 易混淆),用独立端口

spring:
  config:
    import: optional:file:.env[.properties]   # 从 .env 读配置;optional=文件不存在也不报错
  datasource:
    url: jdbc:postgresql://localhost:5433/kbrag
    username: kbrag
    password: kbrag123
  jpa:
    hibernate:
      ddl-auto: none     # update → none:DDL 全部由 schema.sql 托管(生成列与 update 迁移冲突)
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  data:
    redis:
      host: localhost
      port: 6379

app:
  llm:
    chat-base-url: https://api.deepseek.com/v1
    chat-model: deepseek-chat
    chat-api-key: ${DEEPSEEK_API_KEY:}
    embedding-base-url: https://api.siliconflow.cn/v1
    embedding-model: BAAI/bge-m3
    embedding-api-key: ${SILICONFLOW_API_KEY:}
  retrieval:
    dense-top-k: 30
    sparse-top-k: 30
    rrf-k: 60
    final-top-k: 5
  agent:
    base-url: http://localhost:9100   # Python Agent 服务地址
  rate-limit:
    capacity: 10        # 桶容量:允许突发 10 次
    refill-per-second: 2  # 每秒补充 2 个令牌
  cache:
    similarity-threshold: 0.95   # 命中阈值(spec §8)
    recent-max: 200              # 候选集上限(算余弦的条目数)
  jwt:
    secret: netdoc-demo-jwt-secret-please-change-in-prod-0123456789abcdef   # ≥32 字节(HS256)
    expire-hours: 24
