[project]
name = "netdoc-agent"
version = "0.2.0"
description = "NetDoc enterprise RAG platform - Python agent service (FastAPI + LangGraph)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
