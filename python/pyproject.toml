[project]
name = "netdoc-agent"
version = "0.2.0"
description = "NetDoc enterprise RAG platform - Python agent service (FastAPI + LangGraph)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

# pytest 9.x 默认 importlib 导入模式,不再自动把项目根加入 sys.path,需显式配置
[tool.pytest.ini_options]
pythonpath = ["."]      # 把项目根(python/)显式加进 sys.path
testpaths = ["tests"]
asyncio_mode = "auto"   # auto 模式:async 测试自动进事件循环,无需逐个 @pytest.mark.asyncio
